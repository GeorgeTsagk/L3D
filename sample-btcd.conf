# Private regtest testing only. Requires the patched backend from make backend.
# LayerTree: https://layertree.tech/
# Source: https://github.com/lightninglabs/layertree
# Tiers: https://layertree.tech/components/tiers.html
# All nine client configurations use this same backend.
# Choose a tree using sample-l3d.json and the operator's proof offer.

regtest=1
experimental-layertree=1
txindex=1

# No P2P listener, seeds or outbound peers.
nolisten=1
nodnsseed=1
maxpeers=0

# Local HTTP RPC. These credentials are for a disposable regtest node.
rpclisten=127.0.0.1:18443
rpcuser=l3d
rpcpass=local-regtest-only
notls=1

# Paths are relative to the directory from which btcd starts.
datadir=data/btcd
logdir=logs/btcd
